# Se true, a joia some (1 unidade) a cada uso. Se false, é infinita.
consumir-ao-usar: false

# Recarga (em segundos) de cada joia, por jogador. 90 = 1 minuto e meio. 0 = sem recarga.
# Para uma joia específica, adicione 'cooldown: <segundos>' dentro dela (ex.: em tita).
cooldown-segundos: 90

# duracao = segundos | nivel = nível do efeito (1 = I, 2 = II, ...)
joias:
  resistencia:
    duracao: 5
    nivel: 3
  forca:
    duracao: 8
    nivel: 2
  velocidade:
    duracao: 15
    nivel: 4
  regeneracao:
    duracao: 5
    nivel: 5
  vida:
    duracao: 5
    nivel: 4
  pulo:
    duracao: 5
    nivel: 5
  tita:
    duracao: 40
    escala: 4.0       # tamanho do jogador (1.0 = normal)
    vida-extra: 20.0  # vida extra em pontos (20 = 10 corações = 1 barra extra)
  ladrao:
    duracao: 30
