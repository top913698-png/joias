# Se true, a joia some (1 unidade) a cada uso. Se false, é infinita.
consumir-ao-usar: false

# Recarga (em segundos) de cada joia, por jogador. 90 = 1 minuto e meio. 0 = sem recarga.
# Para uma joia específica, adicione 'cooldown: <segundos>' dentro dela (ex.: em tita).
cooldown-segundos: 90

# duracao = segundos | nivel = nível do efeito (1 = I, 2 = II, ...)
joias:
  resistencia:
    duracao: 5
    nivel: 2
  forca:
    duracao: 5
    nivel: 2
  velocidade:
    duracao: 5
    nivel: 2
  regeneracao:
    duracao: 5
    nivel: 2
  vida:
    duracao: 5
    nivel: 3
  pulo:
    duracao: 5
    nivel: 5
  tita:
    duracao: 20
    escala: 3.0       # tamanho do jogador (1.0 = normal)
    vida-extra: 20.0  # vida extra em pontos (20 = 10 corações = 1 barra extra)
    velocidade-nivel: 3  # nível de Velocidade enquanto ativo (0 = sem velocidade)
  ladrao:
    duracao: 45
  levitacao:
    duracao: 2
    nivel: 35
  revelacao:
    duracao: 60
    raio: 100.0
    incluir-mobs: false  # true = também revela mobs, não só jogadores
